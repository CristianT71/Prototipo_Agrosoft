<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrosoft - Agregar Venta</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/agregar-venta.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body id="dashboard">
    <div class="contenedor-dash">
        <aside class="menu-lateral">
            <div class="header-menu">
                <img src="/assets/images/logo/logo-sena.png" alt="Logo Sena" class="logo">
                <div class="texto-header">
                    <h2>AgroSoft</h2>
                    <p>Proyecto SENA</p>
                    <div class="icono-cerrar">
                        <img src="/assets/images/icons/icono-cerrar.svg">
                    </div>
                </div>
                <div class="icono-cerrar2">
                    <img src="/assets/images/icons/icono-chevron-izquierda.svg">
                </div>
            </div>

            <nav class="lista-menu">
                <ul>
                    <li><a href="./dashboard.html"><img src="/assets/images/icons/icono-inicio-w.svg"><span>Dashboard</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-paquete.svg"><span>Unidades Productivas</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-alerta-triangulo.svg"> <span>Incidencias</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-jeringa.svg"> <span>Tratamientos</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-trigo.svg"> <span>Cosechas</span></a></li>
                    <li class="activo"><a href="#"><img src="/assets/images/icons/icono-signo-dolar.svg"> <span>Ventas</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-archivo.svg"> <span>Inventario</span></a></li>
                    <li><a href="./tareas.html"><img src="/assets/images/icons/icono-calendario.svg"> <span>Tareas</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-archivo-texto.svg"> <span>Reportes</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-campana.svg"> <span>Alertas</span></a></li>
                    <li><a href="#"><img src="/assets/images/icons/icono-historial.svg"> <span>Historial</span></a></li>

                </ul>
            </nav>

            <div class="footer-menu">
                <ul>
                    <li><a href="#"><img src="/assets/images/icons/icono-configuracion.svg"> <span>Configuración</span></a></li>
                    <li><a href="./login.html" style="color: #E91822;"><img src="/assets/images/icons/icono-cerrar-sesion.svg"> <span>Cerrar Sesión</span></a></li>
                </ul>

                <div class="perfil-usuario">
                    <div class="avatar">U</div>
                    <div class="correo-usuario">
                        <span>usuario@ejemplo.com</span>
                        <span style="color: rgb(155, 161, 161);">User</span>
                    </div>
                </div>
            </div>
        </aside>

        <div class="contenido-principal">

            <header class="barra-superior">
                <div class="boton-hamburguesa">
                    <button>☰</button>
                </div>
                <div class="buscador">
                    <img src="/assets/images/icons/icono-buscar.svg">
                    <input type="text" placeholder="Buscar...">
                </div>
                <div class="iconos-header">
                    <button><img src="/assets/images/icons/icono-campana.svg"></button>
                    <button>U</button>
                </div>
            </header>

            <main class="contenedor" >
                <section class="header-venta">
    <div class="titulo-venta">
        <button class="btn-volver">
        <a href="./venta.html">  <img  src="/assets/images/icons/icono-flecha-izquierda.svg"></a>
        </button>

        <div>
            <h1>Nueva Venta</h1>
            <p>Registra una operación de venta</p>
        </div>
    </div>
</section>

<section class="contenedor-venta">
    <form class="form-venta">
        <div class="fila-venta">
            <div class="grupo-input">
                <label>Cosecha *</label>
                <select>
                    <option>Seleccionar cosecha</option>
                    <option>Tomate Cherry -45kg</option>
                    <option>Lechuga -120 Unidades</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Cliente/Comprador *</label>
                <input type="text">
            </div>
        </div>

        <div class="fila-venta">
            <div class="grupo-input">
                <label>Cantidad vendida *</label>
                <input type="number">
            </div>

            <div class="grupo-input">
                <label>Precio total ($) *</label>
                <input type="number">
            </div>
        </div>

        <div class="fila-venta">
            <div class="grupo-input fecha-input">
                <label>Fecha de venta *</label>
                <input type="date">
            </div>
        </div>

        <div class="grupo-input">
            <label>Notas</label>
            <textarea></textarea>
        </div>

        <hr>

        <div class="acciones-venta">
            <button type="button" class="btn-cancelar">
                Cancelar
            </button>

            <button class="btn-guardar">
                <i class="bi bi-floppy" style="color:white;"></i>
                Guardar
            </button>
        </div>
    </form>

</section>
                    
            </main>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>
</html>
